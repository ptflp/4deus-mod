name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm check

      - name: Build plugin
        run: pnpm build

      - name: Package plugin
        run: |
          mkdir -p out/4deusMod
          cp -r dist LICENSE README.md logo.png package.json plugin.json out/4deusMod/
          cd out
          zip -r 4deusMod.zip 4deusMod

      - uses: actions/upload-artifact@v4
        with:
          name: 4deusMod
          path: out/4deusMod.zip
