name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types, complexity, and behavior
        run: pnpm check

      - name: Build plugin
        run: pnpm build

      - name: Package plugin
        run: |
          mkdir -p out/4deusMod
          cp -r assets bin dist docs LICENSE README.md app_bridge.py mangoapp_hotfix.py nested_desktop_mouse.py steam_artwork.py steamos_application.py logo.png main.py package.json plugin.json out/4deusMod/
          cd out
          zip -r 4deusMod.zip 4deusMod

      - uses: actions/upload-artifact@v7
        with:
          name: 4deusMod
          path: out/4deusMod.zip

  release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION="$(jq -r .version package.json)"
          test "v${PACKAGE_VERSION}" = "${RELEASE_TAG}"

      - uses: actions/download-artifact@v7
        with:
          name: 4deusMod
          path: release

      - name: Create checksum
        run: |
          cd release
          sha256sum 4deusMod.zip > 4deusMod.zip.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/4deusMod.zip \
            release/4deusMod.zip.sha256 \
            --verify-tag \
            --generate-notes \
            --latest \
            --title "4deus Mod ${GITHUB_REF_NAME}"
